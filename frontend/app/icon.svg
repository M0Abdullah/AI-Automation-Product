<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AI Testing Platform">
  <!-- Matches the in-app brand mark, so the browser tab is recognisable next to
       a dozen other localhost tabs. Next.js App Router serves app/icon.svg as
       the favicon automatically - no <link> tag needed. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d6afc" />
      <stop offset="55%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)" />
  <text
    x="32"
    y="43"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
    font-size="30"
    font-weight="800"
    letter-spacing="-1.5"
    fill="#ffffff"
  >AI</text>
</svg>
